<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>리드마스터 학원 OS · 옥길 허브 모듈</title>
    <style id="okh-host-css">
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: #f3e8dc; color: #2a221c; font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
.host-bar {
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  padding: 14px 22px; background: #3d6b5e; color: #fff8ee;
}
.host-bar span { opacity: .75; margin-left: 10px; font-size: 13px; }
.host-bar nav span { margin-left: 16px; opacity: .55; }
.host-bar nav .on { opacity: 1; border-bottom: 1px solid #f4efe6; padding-bottom: 2px; }
main {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 16px;
  max-width: 1120px;
  margin: 0 auto;
}
#okgil-slot { width: 100%; min-height: 480px; }
.host-side { font-size: 13px; color: #5c564b; min-width: 0; }
.host-side details { border: 1px solid #ddd4c4; border-radius: 10px; background: #fffdf8; padding: 8px 12px; }
.host-side summary { cursor: pointer; color: #6b6458; }
.host-events { margin: 8px 0 0; padding: 0; list-style: none; }
.host-events li {
  padding: 8px 0;
  border-top: 1px solid #eee6d8;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.host-events li:first-child { border-top: 0; }
.host-events .t { color: #8a8274; margin-right: 8px; }
.host-events .k { font-weight: 600; margin-right: 8px; }

.host-side { display: none; }

    </style>
    <style id="okh-module-css">
.okh-root {
  --okh-bg: #f7efe4;
  --okh-paper: #fffaf3;
  --okh-ink: #2a221c;
  --okh-mute: #7a6d62;
  --okh-line: #ead9c8;
  --okh-pine: #3d6b5e;
  --okh-pine-2: #4f8576;
  --okh-exam: #b45a45;
  --okh-off: #7a6d62;
  --okh-chip: #f3e6d6;
  --okh-blush: #f6d9cf;
  --okh-cream: #fff4e6;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color: var(--okh-ink);
  background: linear-gradient(180deg, #fff8ee 0%, var(--okh-bg) 220px);
  max-width: 1080px;
  margin: 0 auto;
  border: 1px solid var(--okh-line);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 18px 40px rgba(80, 48, 28, 0.08);
  box-sizing: border-box;
}
.okh-root *, .okh-root *::before, .okh-root *::after { box-sizing: border-box; }
.okh-root[data-theme="dark"] {
  --okh-bg: #1a1916;
  --okh-paper: #24221d;
  --okh-ink: #f3eee4;
  --okh-mute: #b2a894;
  --okh-line: #3a362d;
  --okh-chip: #322e26;
}
.okh-bar {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--okh-paper);
  border-bottom: 1px solid var(--okh-line);
  flex-wrap: wrap;
}
.okh-brand { font-weight: 700; letter-spacing: -0.03em; }
.okh-brand small { display: block; font-weight: 400; color: var(--okh-mute); font-size: 12px; margin-top: 2px; }
.okh-select {
  border: 1px solid var(--okh-line);
  background: var(--okh-bg);
  color: var(--okh-ink);
  border-radius: 10px;
  padding: 8px 10px;
  font: inherit;
}
.okh-tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px 0; }
.okh-tab {
  border: 0;
  background: transparent;
  color: var(--okh-mute);
  padding: 8px 10px;
  border-radius: 999px;
  font: inherit;
  cursor: pointer;
}
.okh-tab[aria-selected="true"] { background: var(--okh-pine); color: #f7f3ea; }
.okh-body { padding: 16px; min-height: 320px; }
.okh-grid { display: grid; gap: 12px; }
@media (min-width: 720px) {
  .okh-cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .okh-cols-2 { grid-template-columns: 1fr 1fr; }
}
.okh-card {
  background: var(--okh-paper);
  border: 1px solid var(--okh-line);
  border-radius: 14px;
  padding: 14px;
}
.okh-card h3 { margin: 0 0 8px; font-size: 14px; color: var(--okh-mute); font-weight: 600; }
.okh-card h2 { margin: 0 0 10px; font-size: 20px; letter-spacing: -0.03em; }
.okh-empty { color: var(--okh-mute); font-size: 14px; line-height: 1.5; }
.okh-list { margin: 0; padding: 0; list-style: none; }
.okh-list li { padding: 8px 0; border-top: 1px solid var(--okh-line); font-size: 14px; }
.okh-list li:first-child { border-top: 0; }
.okh-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  min-width: 40px;
  padding: 0;
  margin: 0;
  background: var(--okh-chip);
  border-radius: 50%;
  font-size: 11px;
  line-height: 1;
  letter-spacing: 0;
  text-align: center;
  flex-shrink: 0;
}
.okh-chip.is-exam { background: #f3d6ce; color: var(--okh-exam); }
.okh-chip.is-off { background: var(--okh-chip); }
.okh-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.okh-cal .okh-dow { text-align: center; font-size: 11px; color: var(--okh-mute); padding: 4px 0; }
.okh-day {
  min-height: 64px;
  border: 1px solid var(--okh-line);
  border-radius: 8px;
  padding: 6px;
  background: var(--okh-paper);
  font-size: 12px;
}
.okh-day strong { display: block; }
.okh-day.is-off { opacity: 0.55; }
.okh-day.is-exam { border-color: var(--okh-exam); }
.okh-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.okh-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--okh-mute); }
.okh-form input, .okh-form select {
  border: 1px solid var(--okh-line);
  background: var(--okh-bg);
  color: var(--okh-ink);
  border-radius: 8px;
  padding: 7px 8px;
  font: inherit;
}
.okh-btn {
  background: var(--okh-pine);
  color: #f7f3ea;
  border: 0;
  border-radius: 10px;
  padding: 9px 12px;
  font: inherit;
  cursor: pointer;
}
.okh-btn.ghost { background: transparent; color: var(--okh-ink); border: 1px solid var(--okh-line); }
.okh-note { font-size: 12px; color: var(--okh-mute); margin-top: 8px; }
.okh-poi { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.okh-foot { padding: 10px 16px 14px; font-size: 11px; color: var(--okh-mute); }

#okgil-slot .okh-root, .okh-root { display: block; width: 100%; }
.okh-select { appearance: auto; min-width: 220px; display: inline-block; }
.okh-tab { display: inline-block; }

.okh-cal-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.okh-cal-nav h2 { margin: 0; flex: 1; font-size: 20px; letter-spacing: -0.03em; }
.okh-cal { min-width: 0; }
.okh-day { min-width: 0; overflow: hidden; }
.okh-day div { overflow-wrap: anywhere; word-break: break-word; line-height: 1.3; color: var(--okh-mute); }
.okh-day.is-today { outline: 2px solid var(--okh-pine); }
.okh-month-list { max-height: 240px; overflow: auto; }

.okh-hero {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 4px 18px;
}
.okh-mascot {
  width: 112px;
  height: 112px;
  object-fit: cover;
  object-position: 50% 28%;
  border-radius: 50%;
  background: var(--okh-cream);
  border: 3px solid #fff;
  box-shadow: 0 8px 20px rgba(80, 48, 28, 0.12);
  flex: 0 0 auto;
}
.okh-speech {
  position: relative;
  background: var(--okh-paper);
  border: 1px solid var(--okh-line);
  border-radius: 18px;
  padding: 14px 16px 12px;
  flex: 1;
  box-shadow: 0 8px 24px rgba(80, 48, 28, 0.05);
}
.okh-speech::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 36px;
  width: 14px;
  height: 14px;
  background: var(--okh-paper);
  border-left: 1px solid var(--okh-line);
  border-bottom: 1px solid var(--okh-line);
  transform: rotate(45deg);
}
.okh-speech-name {
  margin: 0 0 6px;
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--okh-pine);
  font-weight: 700;
}
.okh-speech p { margin: 0; line-height: 1.55; font-size: 16px; }
.okh-hero.is-exam .okh-speech { border-color: #f0c8bc; background: #fff6f2; }
.okh-hero.is-off .okh-speech { background: #f6f3ee; }
.okh-brief { margin-top: 4px; }
.okh-brief-card { min-height: 140px; transition: transform .15s ease; }
.okh-brief-card.is-exam { border-color: #efc4b6; background: linear-gradient(180deg, #fff7f3, var(--okh-paper)); }
.okh-brief-card.is-off { background: linear-gradient(180deg, #f7f3ee, var(--okh-paper)); }
.okh-brief-card.is-meal { background: linear-gradient(180deg, #fff8e8, var(--okh-paper)); }
.okh-brief-card.is-calm { background: var(--okh-paper); }
.okh-brief-more { margin: 16px 0 0; text-align: center; }
.okh-card {
  box-shadow: 0 6px 18px rgba(80, 48, 28, 0.04);
}
.okh-tabs { padding: 12px 16px 0; }
.okh-tab { font-size: 14px; padding: 8px 12px; }
.okh-bar { padding: 16px 18px 14px; background: transparent; border-bottom: 0; }
.okh-brand { font-size: 18px; }
@media (max-width: 640px) {
  .okh-hero { flex-direction: column; text-align: center; }
  .okh-speech::before { display: none; }
  .okh-mascot { width: 96px; height: 96px; }
}

.okh-tab.okh-abbr, .okh-pills .okh-tab {
  min-width: 44px;
  text-align: center;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-size: 13px;
}
.okh-chip {
  font-weight: 700;
}
.okh-chip.is-cho { background: #dceee6; color: #2d6a5c; }
.okh-chip.is-jung { background: #dce6f2; color: #3a5a80; }
.okh-chip.is-go { background: #efe0f0; color: #6a3d6e; }
.okh-chip.is-bosup { background: #f3d6ce; color: #8a2f1d; }
.okh-chip.is-ye { background: #f6e4c8; color: #8a5a1d; }
.okh-chip.is-pe { background: #d8efe4; color: #1f4d43; }
.okh-chip.is-lang { background: #dde8f5; color: #2c4d7a; }
.okh-chip.is-etc { background: var(--okh-chip); color: var(--okh-mute); }

.okh-quote {
  display: block;
  background: #3d6b5e;
  color: #fff8ee;
  padding: 16px 18px 14px;
  border-bottom: 1px solid #2f564b;
}
.okh-quote-text {
  margin: 0 0 6px;
  font-size: 18px;
  line-height: 1.5;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #fff8ee;
}
.okh-quote-by { margin: 0; font-size: 12px; color: #d9cbb6; }
.okh-quote-by a { color: #f3e0a8; }
.okh-dday-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.okh-dday {
  border: 1px solid var(--okh-line);
  background: var(--okh-paper);
  border-radius: 14px;
  padding: 8px 10px;
  min-width: 88px;
  cursor: pointer;
  font: inherit;
  text-align: left;
}
.okh-dday strong { display: block; font-size: 12px; color: var(--okh-mute); }
.okh-dday span { font-weight: 800; color: var(--okh-pine); }
.okh-dday.is-on { border-color: #efc4b6; background: #fff7f3; }
.okh-dday.is-on span { color: var(--okh-exam); }
.okh-dday em { display: block; font-style: normal; font-size: 10px; color: var(--okh-exam); }
.okh-tip { margin-bottom: 12px; }
.okh-tip a { color: var(--okh-pine); }
.okh-body { position: relative; }
.okh-wm {
  pointer-events: none;
  position: absolute;
  inset: 12px 16px auto 16px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--okh-pine);
  opacity: 0.09;
  letter-spacing: -0.02em;
  font-weight: 700;
  z-index: 0;
}
.okh-body > *:not(.okh-wm) { position: relative; z-index: 1; }
.okh-study {
  display: block;
  margin: 0;
  padding: 10px 18px 12px;
  background: #fff4e6;
  color: #2a221c;
  border-bottom: 1px solid var(--okh-line);
  font-size: 14px;
  line-height: 1.5;
}
.okh-study strong { color: var(--okh-pine); margin-right: 6px; }
.okh-study em { display: block; margin-top: 4px; font-style: normal; font-size: 11px; color: var(--okh-mute); }
.okh-study-line { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: var(--okh-ink); }
.okh-study-line strong { color: var(--okh-pine); display: block; font-size: 12px; margin-bottom: 2px; }
.okh-study-card { margin: 12px 0; background: linear-gradient(180deg, #fff8ee, var(--okh-paper)); }
.okh-day-tip { font-size: 10px; color: var(--okh-pine); opacity: 0.72; margin-top: 4px; font-weight: 600; }
.okh-dish { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.okh-dish-name { font-weight: 600; overflow-wrap: anywhere; }
.okh-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.okh-tag {
  display: inline-block;
  width: auto;
  height: auto;
  min-width: 0;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--okh-chip);
  color: var(--okh-mute);
  font-size: 11px;
  line-height: 1.4;
  font-weight: 600;
}

    </style>
  </head>
  <body>
    <header class="host-bar">
      <div>
        <strong>리드마스터 학원 OS</strong>
        <span>호스트 앱 · 아래 슬롯에 허브 모듈을 붙였습니다</span>
      </div>
      <nav>
        <span class="on">교육허브</span>
        <span>상담</span>
        <span>출결</span>
      </nav>
    </header>
    <main>
      <section>
        <div id="okgil-slot"></div>
      </section>
    </main>
    <script type="module" src="/demo/main.js?v=13"></script>
  </body>
</html>
